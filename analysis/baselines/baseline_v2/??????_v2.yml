    - data:
        classes:
        - id: '1784981917529'
          label: 投诉
          name: "投诉：用户核心诉求是追责、赔偿、曝光、道歉，且目的意图是\"投诉\"本身。\n\n【强信号词，命中任一即归此类】\n- 含\"投诉\"\
            作为目的：如\"我要投诉\"、\"申请投诉\"、\"举报\"、\"投诉你们\"\n- 含追责/曝光意图：如\"曝光\"、\"12315\"\
            、\"律师\"、\"媒体\"、\"消协\"、\"起诉\"、\"报警\"\n- 情绪极度愤怒且核心诉求是追责/赔偿/曝光（而非办理退款）\n\
            - 含物流/包装/服务不满：如\"物流太慢了\"、\"包装有划痕\"、\"配送时间不合适\"、\"物流信息不更新\"、\"商品外盒有压痕\"\
            、\"快递员态度差\"\n\n【排除规则——以下情况不归投诉】\n- 若用户核心诉求是办理\"退款/退货/换货\"（即希望完成售后操作），\n\
            \  即使附带说\"转人工\"，仍归为\"退款换货\"\n  示例：\"退订单12345，转人工\" → 退款换货（由工作流路由转人工）\n\
            - 若用户核心诉求是查询订单状态，即使不满情绪，仍归为\"订单查询\"\n- 若用户仅说\"转人工\"且无明确目的意图 → 归为\"其他\"\
            \n- 若用户核心诉求是\"退款/退货/换货\"（即希望完成售后操作），即使附带抱怨物流/包装，仍归为\"退款换货\"\n  示例：\"包装破了，我要退货\"\
            \ → 退款换货（目的是退货）\n -但若用户核心是追责/抱怨本身（非办理售后），则归\"投诉\"\n  示例：\"物流太慢了，什么破服务\"\
            \ → 投诉（无办理诉求）\n -若用户仅说\"转人工/找人工/人工客服\"且无任何投诉/追责/赔偿表述 → 归为\"其他\"（转人工是诉求而非投诉）\n\
            \n【示例】\n- \"我要投诉，我现在情绪很激动\" → 投诉\n- \"投诉你们服务太差\" → 投诉\n- \"我要曝光到网上\" →\
            \ 投诉"
        - id: '1784981904862'
          label: 退款换货
          name: "用户核心诉求是办理退款、退货、换货等售后操作（以完成售后办理为目的）。\n\n【强信号词，命中任一即归此类】\n- 含\"退款/退钱/退费\"\
            ：如\"我要退款\"、\"申请退款\"、\"退钱\"\n- 含\"退货/寄回\"：如\"我要退货\"、\"退回商品\"\n- 含\"换货/换一个/换型号\"\
            ：如\"我要换货\"、\"换个颜色\"\n- 含\"换颜色/换尺寸/尺寸不对/发错了要换/颜色不对要换\"：如\"换个颜色\"、\"尺寸不对要换\"\
            \n- 如果对话历史显示客服正在退款/换货流程中，用户补充订单号或退款原因等信息时，归于此类\n- 含\"取消/修改/改\"作为办理动作：如\"\
            取消订单\"、\"修改订单\"、\"帮我改地址\"\n\n【排除规则】\n- 若用户核心诉求是\"投诉\"（即目的是追责/赔偿/曝光/转人工），即使涉及退款话题，也归为\"\
            投诉\"\n- 若用户只是在查询订单状态，归为\"订单查询\"\n- \"换货多久能收到\"  归为商品咨询（咨询换货时效，非申请换货）\n\
            - \"换货流程是什么\" 归为商品咨询（咨询流程，非办理）\n- \"退货政策是什么\"  归为商品咨询（咨询政策，非办理）\n- \"\
            所有商品都能退吗\"  归为商品咨询（咨询规则，非办理）\n- \"质保期多久\" 归为商品咨询（咨询质保政策，非办理）\n\n【示例】\n\
            - \"我要退款，你们这破店骗人\" → 退款换货（目的是退款）\n- \"申请退货\" → 退款换货\n- \"我要换货\" → 退款换货\n\
            -退订单 3178642857123454→ 退款换货\n- \"退钱+曝光/退款+曝光\"组合 → 退款换货（核心动作是退钱，曝光是情绪威胁）\n\
            \  示例：\"我要退钱还要曝光你们\" → 退款换货（不是投诉）\n  示例：\"退款！曝光你们\" → 退款换货\n不包括：\n-”七天无理由退货怎么操作“\
            \ → 商品咨询\n- \"我要投诉退款处理太慢\" → 投诉（目的是投诉，不归此类）\n-所有商品都能退吗→ 属于商品咨询和规则咨询，不属于退款退货\n\
            -退款多久到账→ 属于商品咨询和规则咨询"
        - id: '2'
          label: 订单查询
          name: "订单查询：用户希望了解【具体某个订单】的实时状态、物流进度或订单详情，\n需要通过【订单号】获取动态数据。\n\n⚠️ 严格触发条件（必须同时满足）：\n\
            1. 用户提供了具体订单号（如\"123456789\"），或明确指向\"我的某个订单\"\n2. 用户核心诉求是查询该订单的实时数据（状态/物流/详情）\n\
            \n❌ 不属于订单查询的场景（即使语句中包含\"订单\"、\"快递\"、\"物流\"等词）：\n- 用户未提供具体订单号，仅咨询平台规则 →\
            \ 商品咨询\n  （如\"发什么快递\"、\"运费多少\"、\"新疆能送到吗\"、\"订单能改地址吗\"）\n- 用户咨询的是操作性流程而非查询数据\
            \ → 退款换货/商品咨询\n  （如\"怎么取消订单\"、\"我要退款\"）\n- 用户核心是投诉或追责 → 投诉\n\n包含以下场景：\n\
            1. 订单状态查询：是否发货、是否支付成功、订单是否存在、当前处于哪个环节\n2. 物流进度追踪：包裹到哪了、预计何时送达、快递单号与承运商、运输轨迹\n\
            3. 下单结果确认：刚下单后确认是否提交成功、支付是否扣款成功\n4. 订单详情核对：订单中的商品规格、数量、收货地址、下单时间、支付方式\n\
            \n典型表述：\"我的订单到哪了\"、\"查一下订单 123456789\"、\"发货了吗\"、\"什么时候能送到\"\n\n不包括：取消订单、修改订单（地址/规格）、退款退货、换货、投诉追责、商品参数咨询、\n\
            以及【未提供具体订单号的商品/规则咨询】——这些分别对应其他分类。"
        - id: '1'
          label: 商品咨询与规则查询
          name: "商品咨询：用户咨询商品本身的规格参数，或咨询平台各类服务规则之类问题。例如：\n发货时间问题、配送相关的问题、签收、快递类型、物流追踪、异常件、订单状态、取消/修改订单、支付方式、发票等问题。这类问题不需要操作用户的\n\
            实时订单数据，而是基于平台公开规则给予解答。则分类到此类。\n\n【强信号词，命中任一即归此类】\n- 发货时效：\"什么时候发货\"、\"\
            何时发\"、\"今天/现在下单什么时候到\"、\n  \"预售多久发货\"、\"定制多久发货\"、\"节假日发货吗\"\n- 配送运费：\"\
            运费多少\"、\"满多少包邮\"、\"新疆能送到吗\"、\"发什么快递\"、\n  \"发顺丰吗\"、\"保价怎么收费\"\n- 签收规则：\"\
            需要本人签收吗\"、\"代签可以吗\"\n- 商品规格：\"参数\"、\"续航\"、\"功能\"、\"和XX哪个好\"、\"怎么选\"\n\
            - 订单规则：\"怎么取消订单\"、\"订单能改地址吗\"、\"待发货是什么意思\"\n- 支付发票：\"支持花呗吗\"、\"怎么开发票\"\
            \n- 退款/换货政策：退款多久到账、退款时效、退款到账时间、换货多久能收到、换货流程、退货政策、质保期多久、所有商品都能退吗\n\n【排除规则——以下情况不归商品咨询】\n\
            - 用户提供了具体订单号并要查询该订单的实时状态/物流轨迹 → 归\"订单查询\"\n- 用户核心诉求是办理退款/退货/换货 → 归\"退款换货\"\
            \n- 用户核心诉求是投诉、追责、转人工、曝光 → 归\"投诉\"\n- 用户明确要求\"转人工\"且无任何业务咨询意图 → 归\"其他\"\
            \n示例：\n- \"发什么快递\" → 商品咨询（注意：不是\"其他\"！）\n- \"运费多少\" → 商品咨询（注意：不是\"其他\"\
            ！）\n- \"什么时候发货\" → 商品咨询（注意：不是\"其他\"！）\n- \"几天能到\" → 商品咨询（注意：不是\"其他\"！）"
        - id: '1784981930016'
          label: 其他
          name: "其他：不属于以上任何分类的未匹配问题，且不包含明确的业务咨询意图。\n\n⚠️ 严格触发条件（必须同时满足）：\n1. 用户输入不属于\"\
            商品咨询\"中的任何子场景\n   （重要：含\"发货\"、\"运费\"、\"签收\"、\"快递\"、\"物流规则\"、\"订单规则\"、\"\
            支付\"、\"发票\"等词的问题，一律归\"商品咨询\"，不归\"其他\"）\n2. 用户未提供具体订单号查询实时数据\n3. 用户核心诉求不是退款/退货/换货\n\
            4. 用户核心诉求不是投诉或追责\n\n【明确归\"其他\"的场景】\n- 闲聊、问候（如\"你好\"、\"谢谢\"）\n- 与电商无关的问题（如\"\
            今天天气怎么样\"）\n- 无法理解的问题（如\"asdfghjkl\"）\n- 用户仅说\"转人工\"且无任何业务咨询意图\n- 非电商场景（如\"\
            订机票\"、\"吃什么药\"、\"买电影票\"、\"今天股票怎么样\"）\n- 含\"找人工/转人工/人工客服/接人工\"且无明确业务诉求：如\"\
            我要找人工\"、\"转人工客服\"、\"接人工\"\n\n【关于\"修改订单地址/指定物流\"的处理——重要澄清】\n- 若用户问\"订单能改地址吗\"\
            、\"怎么改收货地址\" → 这是订单规则咨询，\n  归\"商品咨询\"（基于平台规则解答），不要归\"其他\"\n- 若用户问\"能指定发顺丰吗\"\
            \ → 这是配送规则咨询，归\"商品咨询\"\n- 仅当用户明确说\"转人工\"且未咨询任何业务规则时，才归\"其他\"\n\n【示例】\n\
            - \"你好\" → 其他\n- \"今天天气怎么样\" → 其他\n- \"asdfghjkl\" → 其他\n- \"转人工\" → 其他\n\
            - \"什么时候发货\" → 商品咨询（不是\"其他\"！）\n- \"运费多少\" → 商品咨询（不是\"其他\"！）\n- \"发什么快递\"\
            \ → 商品咨询（不是\"其他\"！）\n- \"订单能改地址吗\" → 商品咨询（不是\"其他\"！）"
        instruction: "你是一个严格的电商客服意图分类器。\n用户问题：{{#1784975306138.structured_output.intent#}}\n\
          规则：\n1. 只根据用户当前这句话判断意图，不依赖任何上游输入，不被措辞情绪带偏\n2. 必须且只能选择一个分类，输出分类名称\n3. 多意图同时存在时，按\"\
          用户核心诉求\"判定（非固定优先级）：\n   - 用户核心是办理退款/退货/换货（即使附带抱怨/曝光）→ 退款换货\n     示例：\"退钱！我要曝光你们\"\
          \ → 退款换货（核心是退钱）\n   - 用户核心是追责/赔偿/曝光本身（非办理售后）→ 投诉\n     示例：\"我要投诉你们服务太差\"\
          \ → 投诉（核心是投诉）\n   - 用户核心是查询订单状态（即使附带不满）→ 订单查询\n     示例：\"物流不对，查一下，投诉你们\"\
          \ → 订单查询（核心是查订单）\n   - 无法确定核心诉求时，按以下默认优先级：投诉 > 退款换货 > 订单查询 > 商品咨询 > 其他\n\
          \n★ 混合意图特殊判定（投诉与退款/查询同时出现时，高优先级优先于上述规则）：\n   - 当用户语句中【同时】出现投诉动作词（\"投诉\"\
          /\"曝光\"/\"12315\"/\"举报\"/\"客服不专业\"/\"气死\"）与退款/查询诉求时：\n     → 若投诉动作词表达的是【追责/不满/曝光】意图（如\"\
          太慢要投诉\"\"客服不专业\"\"丢了要投诉\"），则核心诉求是投诉，intent=complaint。退款/换货是附带诉求，不改变主意图。\n\
          \       示例：\"快递太慢了我要投诉还要退款\" → complaint（核心是投诉，退款是附带）\n       示例：\"等了好久还没到要退款要投诉\"\
          \ → complaint（核心是投诉追责）\n       示例：\"你们的客服不专业要投诉要退款\" → complaint（核心是投诉客服）\n\
          \       示例：\"包裹丢了又没收到退款要投诉\" → complaint（核心是投诉追责）\n       - 若核心动作是【查询订单】且带\"\
          要查/查一下/帮我查\"等明确查询动作词，即使同时出现\"要投诉\" → query_order\n     判定依据：查询（要查）是【前置动作】，投诉（要投诉）是【后续诉求】。用户要先查清状况，投诉是查完后的追加动作。\n\
          \     示例：\"物流信息不对要查要投诉\" → query_order（核心是先查物流，\"要投诉\"是后续动作）\n     示例：\"\
          物流信息不对要查\" → query_order（核心是查单）\n     示例：\"物流不对，查一下，投诉你们\" → query_order（核心是查订单）\n\
          \     ⚠️ 注意：当\"要查\"和\"要投诉\"并列出现时，一律优先 query_order，不要因\"投诉\"二字改判 complaint\n\
          \     → 若投诉动作词是纯粹情绪化伴随（如\"气死我了\"\"太气人了\"），而明确动作是退款/换货 → 退款换货\n       示例：\"\
          退钱！我要曝光你们\" → refund（主动作是退钱）\n       示例：\"发错货了，要换，太气人了\" → refund/exchange（主动作是换货）\n\
          4. 核心诉求判定法：\n   -用户问\"发什么快递/运费多少/什么时候发货/发货时间/几天能到/怎么开发票/支持花呗吗/订单能改地址吗/包裹丢了怎么赔\"\
          等平台规则 → 商品咨询\n   - 用户提供了具体订单号（16-20位数字）并要查该订单的实时状态/物流 → 订单查询\n   - 用户说\"\
          退款/退货/换货\" → 退款换货\n   - 用户说\"投诉/曝光/12315/举报\" → 投诉\n5. 边界判定要点：\n   - \"\
          发什么快递\" → 商品咨询（问的是规则，不是查具体订单）\n   - \"我的包裹到哪了\"+ 订单号 → 订单查询\n   - \"我的包裹到哪了\"\
          + 无订单号 → 商品咨询（引导用户提供订单号或自助查询）\n   - \"订单能改地址吗\"（无具体订单号）→ 商品咨询（咨询规则）\n  \
          \  - \"帮我改订单地址\"+ 有订单号 → 退款换货（办理动作，由 action_type=modify 处理后转人工）\n- \"什么时候发货\"\
          /\"几天能到\" → 商品咨询（问的是发货规则，不是查具体订单）\n- \"发货了吗\" + 无订单号 → 商品咨询（引导用户提供订单号）\n\
          - \"发货了吗\" + 有订单号 → 订单查询\n6. 咨询与 办理的区分（高优先级，覆盖以上规则）：\n   判定法：带疑问词（吗/多久/怎么/能不能/是否/能不能退/能不能换）的是\"\
          咨询规则\"→ 商品咨询；带祈使语气（我要/帮我/请/退订单+号码）的是\"办理动作\"→ 退款换货\n   - \"所有商品都能退吗\" →\
          \ 商品咨询（咨询退货政策，非申请退货）\n   - \"退货政策是什么\" → 商品咨询\n   - \"我要退款\"/\"退订单12345\"\
          \ → 退款换货（办理动作）\n   - \"换货多久能收到新商品\" → 商品咨询（咨询换货时效，非申请换货）\n   - \"换货流程是什么\"\
          \ → 商品咨询\n   - \"我要换货\" → 退款换货（办理动作）\n   - \"质量问题能免费修吗\" → 商品咨询（咨询质保政策，非申请售后）\n\
          \   - \"质保期多久\" → 商品咨询\n   - \"质量问题要退货\" → 退款换货（办理动作）\n   - \"什么时候发货\"（无订单号）\
          \ → 商品咨询（咨询发货规则）\n   - \"今天下单什么时候发\" → 商品咨询\n   - \"我的订单什么时候发货\"（有订单号） →\
          \ 订单查询\n   - \"退款多久到账\" → 商品咨询（咨询退款时效，非申请退款）\n   - \"退款到账时间\" → 商品咨询（咨询政策）\n\
          \   - \"换货多久能收到\" → 商品咨询（咨询换货时效，非申请换货）\n   - \"修改订单\"/\"取消订单\" → 退款换货（办理动作，非转人工改地址）\n\
          \    - \"帮我改订单地址\" → 退款换货（办理动作，由 action_type=modify 处理）\n7. 禁止输出解释，只输出分类名称\n\
          8. 如果对话历史中客服正在处理退款/换货流程（如要求用户提供订单号），且用户当前输入是在补充订单号等信息，则归为\"退款换货\""
