    - data:
        context:
          enabled: true
          variable_selector:
          - conversation
          - conversation_history
        default_value:
        - key: text
          type: string
          value: '{"intent":"other","entities":{"product_name":null,"order_id":null,"issue_type":null},"need_human":false,"sentiment":"neutral"}'
        error_strategy: default-value
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: fbd07b8b-232a-49d7-ad73-4ec2e7ce4c51
          role: system
          text: "你是一个电商智能客服的意图识别与槽位提取引擎。\n\n## 核心任务\n分析用户的当前输入（结合对话历史理解指代），输出严格符合\
            \ JSON Schema 的结构化结果。\n\n## 意图分类定义\n- query_order：查订单（关键词：订单、下单记录、买了什么）\n\
            - refund：退款退货（关键词：退款、退钱、不想要了、退货、寄回）\n- exchange：换货（关键词：换货、换一个、换型号、换颜色、换尺寸、尺寸不对、发错了要换、颜色不对要换）\n\
            - consult：商品咨询（关键词：这款怎么样、参数、续航、适不适合、什么时候发货、发货时间、几天能到、运费多少、发什么快递、怎么开发票、能改地址吗、包裹丢了怎么赔）\n\
            - complaint：投诉（关键词：投诉、气死、骗人、垃圾、差评、物流太慢、包装破损、包装有划痕、配送时间不合适、物流信息不更新、商品外盒有压痕、快递员态度差、服务态度差）\n\
            - other：其他未匹配意图\n\n## 多轮对话续接规则（最高优先级）\n1. 如果对话历史中客服正在处理退款/换货流程（如要求用户提供订单号、退款理由等），且用户当前输入是在回应这些提问，则\
            \ 保持原有意图不变\n2. 特别地：当客服在退款流程中要求用户提供订单号，用户回复中包含订单号（16-20位数字）时，intent 必须为\
            \ \"refund\"\n3. 判断方法：参考对话历史最后一条客服消息，如果包含\"请提供订单号\"、\"订单号是多少\"等提问，且用户当前输入包含订单号，则\
            \ intent = \"refund\"\n4. 同理适用于换货流程：如果上一轮在处理换货，用户补充信息时保持 intent = \"exchange\"\
            \n\n## 槽位提取规则\n- product_name：从用户输入中提取完整商品名（如\"索尼WF-1000XM5蓝牙耳机\"），未提及则为\
            \ null\n- order_id：提取订单号（通常为 16-20 位数字），未提及则为 null\n- issue_type：提取问题类型，枚举值：质量问题/物流问题/尺寸不符/描述不符/价格问题/其他，未提及则为\
            \ null\n- action_type：售后动作类型，仅当 intent=refund 时提取，枚举值：\n   - refund：退款退货（关键词：退款、退钱、不想要了、退货、寄回、改订单、修改订单、取消订单）\n\
            注意：\"帮我改地址\"/\"修改订单地址\"（祈使语气）→ refund；\"能改地址吗\"（疑问语气）→ consult\n   - cancel：用户要取消订单（如\"\
            取消订单\"、\"帮我取消\"、\"不要了取消\"）\n   - modify：用户要修改订单信息（如\"修改订单\"、\"修改订单地址\"\
            、“改地址”、\"改规格\"、\"改颜色\"）\n当 intent≠refund 时，action_type 固定为 null\n\n##\
            \ 转人工判断\n以下情况 need_human 必须为 \"true\"：\n1. intent 为 complaint\n2. 需要人工操作的事情，例如修改或指定快递类型和物流方式，不包括询问快递类型\n\
            注意：改地址由 LLM取消/修改处理节点基于订单状态自动回复，need_human 设为 false\n3. 用户明确要求\"转人工\"、\"\
            人工客服\"\n其他情况 need_human 为 \"false\"\n\n\n## 情绪判断\n- positive：感谢、满意、赞美\n\
            - negative：愤怒、不满、焦虑、催促\n- neutral：中性陈述、询问\n\n## 输出规则（必须遵守）\n1. 只输出一个 JSON\
            \ 对象，不要输出任何解释性文字\n2. 不要使用 Markdown 代码块标记（不要出现 ```json 或 ```）\n3. 严格遵循\
            \ JSON Schema 的字段类型和 required 约束\n4. 未提及的实体槽位必须显式输出 null，不能省略\n5. intent\
            \ 必须是枚举值之一，不能自创\n6. 当用户输入中出现\"它\"、\"这款\"、\"那个\"等指代时，参考对话历史中的 product_name\
            \ 填充\n\n## 输出格式示例\n{\"intent\":\"consult\",\"entities\":{\"product_name\"\
            :\"索尼WF-1000XM5蓝牙耳机\",\"order_id\":null,\"issue_type\":null,\"action_type\"\
            :null},\"need_human\":false,\"sentiment\":\"neutral\"}\n{\"intent\":\"\
            refund\",\"entities\":{\"product_name\":null,\"order_id\":\"1234567890123456\"\
            ,\"issue_type\":null,\"action_type\":\"cancel\"},\"need_human\":false,\"\
            sentiment\":\"negative\"}"
        - id: 9c625c42-9fec-4892-9480-0b4f66e2dd4c
          role: user
          text: '历史对话：

            {{#sys.conversation_id#}}

            {{#context#}}


            当前会话意图：{{#conversation.current_intent#}}

            当前退款步骤：{{#conversation.refund_step#}}


            当前用户输入：

            {{#sys.query#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              entities:
                description: 从用户消息中提取的实体槽位
                properties:
                  action_type:
                    description: 售后动作类型。仅当 intent=refund 时有意义：refund（退款退货）、cancel（取消订单）、modify（修改订单）；其他意图为
                      null
                    enum:
                    - refund
                    - cancel
                    - modify
                    - 'null'
                    type:
                    - string
                    - 'null'
                  issue_type:
                    description: 问题类型，如 质量问题/物流问题/尺寸不符/描述不符，未提及则为 null
                    type:
                    - string
                    - 'null'
                  order_id:
                    description: 订单号，未提及则为 null
                    type:
                    - string
                    - 'null'
                  product_name:
                    description: 商品名称，未提及则为 null
                    type:
                    - string
                    - 'null'
                required:
                - product_name
                - order_id
                - issue_type
                - action_type
                type: object
              intent:
                description: 用户意图，如 query_order（查订单）、refund（退款）、exchange（换货）、consult（商品咨询）、complaint（投诉）、other（其他）
                enum:
                - query_order
                - refund
                - exchange
                - consult
                - complaint
                - other
                type: string
              need_human:
                description: 是否需要转人工客服，枚举值：true/false
                enum:
                - 'true'
                - 'false'
                type: string
              sentiment:
                description: 用户情绪倾向
                enum:
                - positive
                - negative
                - neutral
                type: string
            required:
            - intent
            - entities
            - need_human
            - sentiment
            type: object
        structured_output_enabled: true
        title: LLM 意图识别
        type: llm
        vision:
          enabled: false
      height: 153
      id: '1784975306138'
