    - data:
        code: "import json\nfrom datetime import datetime, timedelta\n\ndef main(order_id:\
          \ str, refund_reason: str, product_name: str) -> dict:\n    if not order_id\
          \ or not order_id[-1].isdigit():\n        return {\n            \"simulated_order_data\"\
          : json.dumps(\n                {\"error\": \"无效的订单号\"}, ensure_ascii=False),\n\
          \            \"eligible\": \"false\",\n            \"rejection_reason\"\
          : \"订单号无效\",\n            \"logistics_status\": \"unknown\",\n         \
          \   \"refund_amount\": \"退款金额将按原支付方式返回\",\n            \"estimated_refund_days\"\
          : \"3\"\n        }\n    \n    last_digit = int(order_id[-1])\n    now =\
          \ datetime.now()\n    \n    # ✅ 修正：运输中和超7天不能同时成立\n    if last_digit in (0,\
          \ 3, 6, 9):\n        # 运输中（未签收）\n        logistics_status = \"transporting\"\
          \n        sign_date = None\n        days_since_sign = None\n        within_7days\
          \ = False  # 未签收，7天时限未启动\n        # ⚠️ 关键：拒绝原因不再是\"超7天\"，而是\"未签收\"\n   \
          \     rejection_reason = \"您的订单目前运输中，尚未签收，不适用7天无理由退货。我们可以为您安排拦截退款，或者等签收后若有问题再申请7天无理由退货\"\
          \n        can_intercept = True  # 可拦截\n    elif last_digit in (1, 5, 7):\n\
          \        # 已签收 10 天前 → 超7天\n        logistics_status = \"delivered\"\n \
          \       days_since_sign = 10\n        sign_date = (now - timedelta(days=days_since_sign)).strftime(\"\
          %Y-%m-%d\")\n        within_7days = False\n        rejection_reason = f\"\
          您的订单已于{sign_date}签收，距今已超过7天无理由退货期限，无法办理退货\"\n        can_intercept = False\n\
          \    else:  # 2,4,8\n        # 已签收 3 天前 → 7天内\n        logistics_status\
          \ = \"delivered\"\n        days_since_sign = 3\n        sign_date = (now\
          \ - timedelta(days=days_since_sign)).strftime(\"%Y-%m-%d\")\n        within_7days\
          \ = True\n        rejection_reason = \"符合7天无理由退货条件\"\n        can_intercept\
          \ = False\n    \n    cannot_return = (logistics_status == \"transporting\"\
          ) or (not within_7days)\n    \n    mock_order = {\n        \"order_id\"\
          : order_id,\n        \"product_name\": product_name,\n        \"logistics_status\"\
          : logistics_status,\n        \"sign_date\": sign_date,\n        \"days_since_sign\"\
          : days_since_sign,\n        \"within_7days\": within_7days,\n        \"\
          eligible_for_refund\": (logistics_status == \"delivered\" and within_7days),\n\
          \        \"refund_reason\": refund_reason or \"未提供\",\n        \"refund_amount\"\
          : \"退款金额将按原支付方式返回\",\n        \"estimated_refund_days\": 3,\n        \"\
          rejection_reason\": rejection_reason,\n        \"can_intercept\": can_intercept,\
          \  # 新增：是否可拦截\n        \"alternative_options\": [\"换货\", \"维修\"] if not\
          \ can_intercept else [\"拦截退款\", \"换货\"],\n        \"refund_policy\": \"\
          依据《网络购买商品七日无理由退货暂行办法》第十条，七日期间自签收商品的次日开始起算\",\n        \"quality_issue\"\
          : refund_reason == \"质量问题\",\n    }\n    \n    return {\n        \"simulated_order_data\"\
          : json.dumps(mock_order, ensure_ascii=False),\n        \"eligible\": \"\
          true\" if (logistics_status == \"delivered\" and within_7days) else \"false\"\
          ,\n        \"rejection_reason\": rejection_reason,\n        \"logistics_status\"\
          : logistics_status,\n        \"refund_amount\": \"退款金额将按原支付方式返回\",\n   \
          \     \"estimated_refund_days\": \"3\"\n    }"
