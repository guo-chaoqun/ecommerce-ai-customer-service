app:
  description: ''
  icon: 🤖
  icon_background: '#D1E9FF'
  icon_type: emoji
  mode: advanced-chat
  name: 电商客服助手
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.0@ae50a2db261bffa7289677f2b0a60e60762ceb187b602113b72425ccbe772dc3
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.5@9aab60635ffd74818b2537320771b0ae8ef49db2a13557ff76e18ae5669df038
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - description: 标记"其他"分支的状态机当前进度
    id: 7d4bfab4-c6c9-467c-a70c-154158cb7341
    name: other_step
    selector:
    - conversation
    - other_step
    value: ''
    value_type: string
  - description: 下一轮对话的上下文承接
    id: 4d0c90aa-2f91-4e1e-a9b6-6f05981c35e3
    name: last_query
    selector:
    - conversation
    - last_query
    value: ''
    value_type: string
  - description: 建立投诉状态机
    id: 5652e3aa-e397-4c35-a28a-1c257066dce2
    name: complaint_step
    selector:
    - conversation
    - complaint_step
    value: initial
    value_type: string
  - description: 投诉类型，枚举值：物流问题/质量问题/服务态度/虚假宣传/安全问题/其他
    id: b31e8dfb-4e21-476c-a3ee-d4a462731390
    name: complaint_type
    selector:
    - conversation
    - complaint_type
    value: ''
    value_type: string
  - description: 用于记录退款流程当前步骤（状态机）
    id: 94845b7b-720d-4fa8-ad46-10403a6c7acd
    name: refund_step
    selector:
    - conversation
    - refund_step
    value: initial
    value_type: string
  - description: 用于记录退货退款的理由
    id: d084d0be-c6f2-4b74-83d2-cb5a1b532cf2
    name: refund_reason
    selector:
    - conversation
    - refund_reason
    value: ''
    value_type: string
  - description: 用于记录退款退货商品的id
    id: c12bb1f2-2ff2-4a1b-bf74-04294a5859f8
    name: refund_order_id
    selector:
    - conversation
    - refund_order_id
    value: ''
    value_type: string
  - description: 用来组建检索知识库/数据库的查询文本
    id: 66375d31-0440-4d78-b7c9-8278644b4c95
    name: retrieval_query
    selector:
    - conversation
    - retrieval_query
    value: ''
    value_type: string
  - description: 用于记录用户具体想了解商品的哪个维度（如续航、颜色、材质等），方便后续拼接检索词。
    id: e818b44e-4281-4907-ba64-c2691de12ebb
    name: current_dimension
    selector:
    - conversation
    - current_dimension
    value: ''
    value_type: string
  - description: 用于记录用户当前问的是哪款商品
    id: 595a22d5-1ee5-47df-be6a-f1fca926f395
    name: current_product
    selector:
    - conversation
    - current_product
    value: ''
    value_type: string
  - description: 对话轮数计数，用于判断转人工
    id: 9e2f3b02-e23a-4f20-9397-6d3942a693c4
    name: turn_count
    selector:
    - conversation
    - turn_count
    value: 0
    value_type: integer
  - description: 暂存用户提供的订单号
    id: acca8b0a-835c-4c18-bea8-780e7886af27
    name: order_id
    selector:
    - conversation
    - order_id
    value: ''
    value_type: string
  - description: 记录当前意图（商品咨询/物流查询/...）
    id: 79fd1da8-5ab4-4565-ada7-4afca4e68afe
    name: current_intent
    selector:
    - conversation
    - current_intent
    value: ''
    value_type: string
  - description: 存储对话历史，实现多轮记忆
    id: e0580646-5e63-4c3e-94ca-3dbeab2aeb5c
    name: conversation_history
    selector:
    - conversation
    - conversation_history
    value: []
    value_type: array[object]
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
