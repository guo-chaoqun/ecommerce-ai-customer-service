            - 退款金额说明：{{#1785227742518.refund_amount#}}   # 如 \"退款金额将按原支付方式返回\"\n-\
            \ 预计退款天数：{{#1785227742518.estimated_refund_days#}}\n- 模拟订单数据：{{#1785227742518.simulated_order_data#}}\n\
            - 用户原始诉求：{{#context#}}\n\n## 回复必须包含的要素\n1. **确认符合退货条件**：明确告知\"您的订单符合7天无理由退货条件\"\
            \n2. **退款金额说明**：直接引用 refund_amount 字段的原话\n   ⚠️ 禁止自行计算、编造或修改金额表述\n   ✅\
            \ 正确：\"退款金额将**按原支付方式返回**\"\n   ❌ 禁止：\"将为您退款1999.0元\"、\"退款1999元\"\n3. **退款时效**：引用\
