            \n→ 禁止说\"超过7天\"、\"不符合退货条件\"（逻辑错误）\n→ 替代方案：拦截退款 / 换货\n\n情况2：{{#1785227742518.logistics_status#}}\
            \ == \"delivered\" 且 not within_7days（已签收超7天）\n→ 标准话术：\"很抱歉，您的订单已于{sign_date}签收，距今已超过7天无理由退货期限，\n\
