    - data:
        code: "def main(success_text: str, fallback_text: str, error_text: str, fourth_text:\
          \ str) -> dict:\n    \"\"\"\n    四个LLM节点的归一化处理\n    优先级：success_text > fallback_text\
          \ > fourth_text > error_text\n    \"\"\"\n    # 对每个输入做空值处理，确保为字符串\n    success\
          \ = success_text if success_text is not None else \"\"\n    fallback = fallback_text\
          \ if fallback_text is not None else \"\"\n    fourth = fourth_text if fourth_text\
          \ is not None else \"\"\n    error = error_text if error_text is not None\
          \ else \"\"\n    \n    final_reply = \"\"\n    \n    # 按优先级判断，使用strip()避免纯空格被当作有效内容\n\
          \    if success.strip():\n        final_reply = success.strip()\n    elif\
          \ fallback.strip():\n        final_reply = fallback.strip()\n    elif fourth.strip():\n\
          \        final_reply = fourth.strip()\n    elif error.strip():\n       \
          \ final_reply = error.strip()\n    \n    # 终极兜底：所有分支均为空时的默认回复\n    if not\
          \ final_reply:\n        final_reply = \"抱歉，退货申请处理出现问题，正在为您转接人工客服...\"\n\
          \    \n    return {\n        \"final_reply\": final_reply,\n        \"structured_message\"\
          : {\n            \"role\": \"assistant\",\n            \"content\": final_reply\n\
          \        }\n    }"
